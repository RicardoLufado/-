# 合约参数（2612 合约）。每项注明来源；未核实的标「待核实」。
# 来源说明：
#   「官方规则」= 比赛官方海报 / App「比赛规则」「常见问题」页
#   「App反推」  = 用 App「1手多少钱」÷（显示价 × 乘数）反推，用户已核实
#   「中金所规则」= 中金所合约规则（乘数、最小变动、到期日规则）
#   「待核实」  = 默认值，尚未与比赛系统核对

contract_month: "2612"

# 股指期货 2612 到期日（12 月第三个周五）。国债期货 2612 最后交易日为 12 月第二个周五。
expiry:
  equity: "2026-12-18"   # 中金所规则：合约到期月份的第三个周五
  bond: "2026-12-11"     # 中金所规则：合约到期月份的第二个周五

contracts:
  - product: IF
    app_name: 沪深2612
    kind: equity
    history_symbol: sh000300        # 历史用指数，不用主力连续合约
    history_name: 沪深300指数
    multiplier: 300                 # 中金所规则
    tick: 0.2                       # 中金所规则
    margin_rate: 0.15               # App反推（4248.0 × 300 × 15% = 191,160），已核实
    app_price_1008: 4248.0          # App 显示价（10-08），仅用于核对，不参与计算
    fee: {type: ratio, open: 0.000023, close: 0.000023, close_today: 0.00023, status: 待核实}

