name: recommend

on:
  workflow_dispatch:
  # 上海时间（Asia/Shanghai），周一至周五。GitHub 定时任务可能延迟或漏跑，
  # 所以开盘前、收盘后各设 3 个时间点，跑到哪次都行，最新一次覆盖之前的结果。
  schedule:
    - cron: "25 8 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "45 8 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "5 9 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "20 15 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "35 15 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "50 15 * * 1-5"
      timezone: "Asia/Shanghai"
  push:
    branches: [main]
    paths:
      - "state/**"
      - "engine/**"
      - "site/**"
      - "config/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import akshare; print('akshare', akshare.__version__)"

      - name: 恢复数据缓存
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            data-cache-

      - name: 运行引擎
        id: engine
        continue-on-error: true
        run: |
          set -o pipefail
          python -m engine.run 2>&1 | tee engine.log

      - name: 引擎失败时用上次成功的结果
        if: steps.engine.outcome != 'success'
        run: python -m engine.fallback --log engine.log

      - name: 结果摘要
        if: always()
        run: python scripts/summarize.py

      - name: 保存数据缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
