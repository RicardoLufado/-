name: recommend

on:
  workflow_dispatch:
  schedule:
    - cron: "45 0 * * 1-5"   # 北京时间 08:45（周一至周五）
    - cron: "35 7 * * 1-5"   # 北京时间 15:35（周一至周五）
  push:
    branches: [main]
    paths:
      - "state/**"
      - "engine/**"
      - "site/**"
      - "config/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import akshare; print('akshare', akshare.__version__)"

      - name: 恢复数据缓存
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            data-cache-

      - name: 运行引擎
        id: engine
        continue-on-error: true
        run: |
          set -o pipefail
          python -m engine.run 2>&1 | tee engine.log

      - name: 引擎失败时用上次成功的结果
        if: steps.engine.outcome != 'success'
        run: python -m engine.fallback --log engine.log

      - name: 结果摘要
        if: always()
        run: python scripts/summarize.py

      - name: 保存数据缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
